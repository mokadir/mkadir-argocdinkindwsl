apiVersion: v1
kind: Service
metadata:
  labels:
    app: jenkins
  name: my-service
  namespace: jenkins-ns
spec:
  type: NodePort
  ports:
    - nodePort: 30002 # The port on the node to expose the service on. match with extraPortMappings containerPort in kind config
      port: 80 # The port the service is exposed on. can be anty port, but 80 is standard for HTTP
      targetPort: 8080 # The port your application is listening on. match with containerPort in deployment.yaml and docker webserver exposed port
  selector:
    app: jenkins
