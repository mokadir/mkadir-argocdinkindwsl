apiVersion: v1
kind: Service
metadata:
  labels:
    app: register-app
  name: my-service
  namespace: app-ns
spec:
  type: NodePort
  ports:
    - nodePort: 30001 # The port on the node to expose the service on. match with extraPortMappings containerPort in kind config
      port: 8080 # The port the service is exposed on
      targetPort: 3000 # The port your application is listening on. match with containerPort in deployment.yaml
  selector:
    app: register-app
