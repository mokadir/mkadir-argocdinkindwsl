apiVersion: v1
kind: Service
metadata:
  name: service-jenkins
  namespace: jenkins2-ns
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/path: /
    prometheus.io/port: '8080'
spec:
  selector:
    app: server-jenkins
  type: NodePort
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30002
