kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: local-storage
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv2-jenkins
  labels:
    type: local
spec:
  storageClassName: localstorage
  claimRef:
    name: pvc2-jenkins
    namespace: jenkins2-ns
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  local:
    path: /mnt
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - my-cluster-dev-worker # If the pod gets deleted or restarted, the data will get persisted in the node volume. However, if the node gets deleted, you will lose all the data.
                - my-cluster-dev-worker2
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc2-jenkins
  namespace: jenkins2-ns
spec:
  storageClassName: localstorage
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 3Gi
