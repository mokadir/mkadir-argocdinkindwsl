apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jenkins # user admin-jenkins previously
rules:
  - apiGroups: [""]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins # user admin-jenkins previously
  namespace: jenkins2-ns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jenkins # user admin-jenkins previously
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: jenkins # user admin-jenkins previously
subjects:
  - kind: ServiceAccount
    name: jenkins # user admin-jenkins previously
    namespace: jenkins2-ns
