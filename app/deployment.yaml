apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: register-app
  name: my-deployment
  namespace: app-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: register-app
  template:
    metadata:
      labels:
        app: register-app
    spec:
      containers:
        - name: register-app
          image: mskr7/mkadir-registerapp
          resources:
            limits:
              memory: 300Mi
              cpu: "0.5"
            requests:
              memory: 256Mi
              cpu: "0.3"
          ports:
            - containerPort: 8080 # The port your application is listening on. match with targetPort in service.yaml and docker webserver exposed port
